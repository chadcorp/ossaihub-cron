name: Refresh OSS AI Hub velocity
on:
  schedule:
    - cron: '53 21 * * *'   # daily 21:53 UTC — cadence IS the measurement window:
                            # the script refreshes EVERY tool each run, so each tool's
                            # star-gain window = time since the previous run. Daily
                            # snapshots feed stars_history, from which the endpoint
                            # computes a true rolling 7-day gain. Do NOT make this more
                            # frequent without checking upsertVelocityData's gain math.
  workflow_dispatch:        # manual trigger from the Actions tab

# Full GitHubVelocity refresh. Computes stars/forks/open-issues on the Actions
# side (GITHUB_TOKEN = 5000 req/hr) and bulk-upserts EVERY tool's velocity row
# through the Base44 `upsertVelocityData` endpoint in small paced batches with
# retry (gains are computed server-side from stars_history daily snapshots).
#
# Replaces the old path that POSTed to `syncGitHubVelocity`, which wrote only
# ~50 of 200 rows/run under Base44's per-row write rate-limit and never advanced
# the most-stale tail — ~445 rows froze for 2+ weeks (hermes-agent 25 days),
# which froze the public Weekly Digest headline for four straight weeks.
# `syncGitHubVelocity` is left in place as a manual fallback.

jobs:
  velocity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node refresh-velocity.mjs
        env:
          GH_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by Actions, no setup
          BASE44_API_KEY:    ${{ secrets.TOOLS_UPSERT_API_KEY }}
